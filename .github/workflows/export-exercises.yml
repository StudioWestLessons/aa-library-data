name: Export Exercise Library from Google Docs

on:
  schedule:
    # Daily, ~6:23am Pacific (13:23 UTC during PDT). Off the :00 mark per
    # GitHub's cron guidance, and offset from the AA library export at 13:07
    # so the two don't contend. The weekly sync-check in studio-west-resources
    # runs many hours later so a fresh doc edit isn't flagged as drift.
    - cron: '23 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export from the Google Doc
        id: export
        run: |
          output=$(python3 export_exercises.py)
          echo "$output"
          echo "result=$(echo "$output" | head -1)" >> "$GITHUB_OUTPUT"
          echo "summary=$(echo "$output" | tail -n +2)" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.export.outputs.result == 'CHANGED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercise-library.json
          git commit -m "Update exercise library data from the doc: ${{ steps.export.outputs.summary }}"
          # Two exports write to this repo (AA at 13:07, exercises at 13:23);
          # rebase first so a same-window commit from the other one can't
          # turn this into a rejected push.
          git pull --rebase
          git push

      - name: Heartbeat commit so GitHub never disables this schedule
        if: steps.export.outputs.result == 'UNCHANGED'
        run: |
          # This repo is public, and GitHub disables scheduled workflows in
          # public repos after 60 days without repository activity — and the
          # warning email it sends first never arrives (email delivery to
          # this account is broken account-wide). Data commits only happen
          # when the doc changed, so if the library has been quiet for 45+
          # days, commit a dated stamp instead; the daily export can then
          # never be switched off for inactivity.
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%d > .heartbeat
            git add .heartbeat
            git commit -m "Heartbeat: keep the daily export schedules alive"
            git pull --rebase
            git push
          fi

      - name: Open an alert issue if the export broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # @mention + assignee so GitHub Mobile pushes this to Greg's phone
          # (account-wide email delivery is broken; mobile push only fires for
          # direct interactions). Don't remove them.
          title="Exercise Library export is failing"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          body="@${{ github.repository_owner }} — the daily Google Doc → exercise-library.json export failed. The site keeps showing the last good data, but it will NOT pick up new doc edits until this is fixed. The most likely cause is the doc's sharing being changed away from \"Anyone with the link can view\".

          Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Ask Claude (in a live session) to investigate."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" \
              --assignee "${{ github.repository_owner }}"
          fi

name: Export AA Library from Notion

on:
  schedule:
    # Daily, ~6:07am Pacific (13:07 UTC during PDT). Off the :00 mark per
    # GitHub's cron guidance. The weekly sync-check in studio-west-resources
    # runs 1h+ after this so a fresh Notion edit isn't flagged as drift.
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      accept_bulk_changes:
        description: >-
          Tick only if the export stopped because many rows changed at once (or
          examples were deleted) and that change is what you meant to do.
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bulk-edit guard asks git when aa-library.json last changed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export from Notion
        id: export
        env:
          # A scheduled run has no inputs, so this is empty there.
          AA_ACCEPT_BULK_CHANGES: ${{ inputs.accept_bulk_changes && '1' || '' }}
        run: |
          # `output=$(cmd)` alone would exit under bash -e before anything was
          # printed or saved, so a failure lost its reason. Capture the status,
          # print the text, write the outputs, THEN exit with the status.
          status=0
          output=$(python3 export_aa.py) || status=$?
          echo "$output"
          {
            echo "result=$(echo "$output" | head -1)"
            echo "summary<<AA_SUMMARY_EOF"
            echo "$output" | tail -n +2
            echo "AA_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Commit updated data
        if: steps.export.outputs.result == 'CHANGED'
        env:
          # Notion-derived text goes through the environment, never straight
          # into the shell command, so a stray quote in a category name is inert.
          SUMMARY: ${{ steps.export.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aa-library.json
          git commit -m "Update AA library data from Notion" -m "$SUMMARY"
          # Two exports write to this repo (AA at 13:07, exercises at 13:23);
          # rebase first so a same-window commit from the other one can't
          # turn this into a rejected push.
          git pull --rebase
          git push

      - name: Heartbeat commit so GitHub never disables this schedule
        if: steps.export.outputs.result == 'UNCHANGED'
        run: |
          # This repo is public, and GitHub disables scheduled workflows in
          # public repos after 60 days without repository activity — and the
          # warning email it sends first never arrives (email delivery to
          # this account is broken account-wide). Data commits reset the
          # clock, but they only happen when Notion changed; if the library
          # has been quiet for 45+ days, commit a dated stamp instead so the
          # daily export can never be switched off for inactivity.
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%d > .heartbeat
            git add .heartbeat
            git commit -m "Heartbeat: keep the daily export schedules alive"
            git pull --rebase
            git push
          fi

      - name: Open an alert issue if the export broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.export.outputs.summary }}
        run: |
          # @mention + assignee so GitHub Mobile pushes this to Greg's phone
          # (account-wide email delivery is broken; mobile push only fires for
          # direct interactions). Don't remove them.
          title="AA Library export is failing"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          body="@${{ github.repository_owner }} - the daily Notion to aa-library.json export stopped. The site keeps showing the last good data, but it will NOT pick up new Notion edits until this is sorted out.

          Why it stopped:

          ${REASON:-(no reason was captured; see the run log)}

          If this says rows are filed wrong or changed all at once, open the Notion library, fix or undo them, and the next daily run publishes by itself. (The Monday sync check may also open its own issue about the same thing. That is expected; this is the one that explains it.)

          Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Ask Claude (in a live session) to investigate."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" \
              --assignee "${{ github.repository_owner }}"
          fi
